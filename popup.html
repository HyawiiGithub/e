<!DOCTYPE html>
<html>
<head>
    <title>Discord Auto Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 200px;
            padding: 10px;
        }
        input {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
        }
        button {
            width: 100%;
            padding: 5px;
            background-color: #7289da;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Discord Auto Login</h2>
    <input type="text" id="token" placeholder="Enter your Discord token">
    <button id="login">Login</button>
    <script src="popup.js"></script>
</body>
</html>
